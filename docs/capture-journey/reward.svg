<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" role="img" aria-labelledby="t">
<title id="t">The reward: a daily job writes an earning, an admin downloads the list, a person pays the grower, the admin uploads the confirmations, the earning becomes paid</title>
<style>
  .bg{fill:#ffffff}.card{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.5}.line{stroke:#8c959f;stroke-width:2;fill:none}
  .t{font:600 17px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#1f2328}.s{font:14px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#656d76}
  .mono{font:13px ui-monospace,Menlo,monospace;fill:#656d76}.num{font:700 15px system-ui,sans-serif;fill:#ffffff}
  .g{fill:#4c9a2a}.gl{fill:#dafbe1}.a{fill:#bf8700}.al{fill:#fff8c5}.r{fill:#cf222e}.b{fill:#0969da}.bl{fill:#ddf4ff}.w{fill:#ffffff}
  .tree1{fill:#4c9a2a}.trunk{fill:#8a6a3b}.dash{stroke-dasharray:6 5}
  @media (prefers-color-scheme: dark){.bg{fill:#0d1117}.card{fill:#161b22;stroke:#30363d}.t{fill:#e6edf3}.s,.mono{fill:#8b949e}
  .gl{fill:#12261e}.al{fill:#272115}.bl{fill:#0c2d6b}.line{stroke:#6e7681}.w{fill:#0d1117}}
</style>
<rect class="bg" width="480" height="560" rx="12"/>
<rect class="card" x="40" y="16" width="400" height="66" rx="10"/><circle class="g" cx="74" cy="49" r="15"/><text class="num" x="74" y="54" text-anchor="middle">1</text><text class="t" x="100" y="45">Every day: count the approved captures</text><text class="s" x="100" y="66">An automatic job, in steps of 100 captures</text>
<path class="line" d="M240 82v14"/><path d="M233 94l7 9 7-9z" fill="#8c959f"/>
<rect class="card" x="40" y="108" width="400" height="66" rx="10"/><circle class="g" cx="74" cy="141" r="15"/><text class="num" x="74" y="146" text-anchor="middle">2</text><text class="t" x="100" y="137">An earning: “calculated”</text><text class="s" x="100" y="158">One record for each grower</text>
<path class="line" d="M240 174v14"/><path d="M233 186l7 9 7-9z" fill="#8c959f"/>
<rect class="card" x="40" y="200" width="400" height="66" rx="10"/><circle class="b" cx="74" cy="233" r="15"/><text class="num" x="74" y="238" text-anchor="middle">3</text><text class="t" x="100" y="229">The funder downloads the list</text><text class="s" x="100" y="250">The Earnings page of the admin panel</text>
<path class="line" d="M240 266v14"/><path d="M233 278l7 9 7-9z" fill="#8c959f"/>
<rect class="card dash" x="40" y="292" width="400" height="66" rx="10"/><circle class="a" cx="74" cy="325" r="15"/><text class="num" x="74" y="330" text-anchor="middle">4</text><text class="t" x="100" y="321">The funder pays the grower</text><text class="s" x="100" y="342">Outside the Greenstand system</text>
<path class="line" d="M240 358v14"/><path d="M233 370l7 9 7-9z" fill="#8c959f"/>
<rect class="card" x="40" y="384" width="400" height="66" rx="10"/><circle class="b" cx="74" cy="417" r="15"/><text class="num" x="74" y="422" text-anchor="middle">5</text><text class="t" x="100" y="413">The funder logs the payments</text><text class="s" x="100" y="434">The Earnings or Payments page</text>
<path class="line" d="M240 450v14"/><path d="M233 462l7 9 7-9z" fill="#8c959f"/>
<rect class="card" x="40" y="476" width="400" height="66" rx="10"/><circle class="g" cx="74" cy="509" r="15"/><text class="num" x="74" y="514" text-anchor="middle">6</text><text class="t" x="100" y="505">The earning: “paid”</text><text class="s" x="100" y="526">The grower gets no message from the app</text>
</svg>
