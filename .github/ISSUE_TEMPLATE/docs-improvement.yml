name: Docs improvement
description: An idea to make these docs more useful to volunteers.
title: "Docs improvement: "
labels: ["documentation", "enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: Tell what to change, and who it helps.
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page
      description: A link to the page that the idea is about, if there is one.
      placeholder: https://
