name: Secrets scan

# Scans for leaked secrets with two independent engines, gitleaks and betterleaks.
# Both read the shared .gitleaks.toml and .gitleaksignore. The scanner CLIs run directly
# (MIT): gitleaks-action needs a paid license key for organization repos.
# A finding fails the job. Reports are always --redact, so logs and summaries hold no secret.

on:
  push:
  pull_request:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-scan-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned scanner releases. Bump the version and the archive SHA-256 together
  # (from the release's checksums file). Dependabot does not track these.
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  BETTERLEAKS_VERSION: 1.9.0
  BETTERLEAKS_SHA256: f8b185a39ffcece2a1ca82bf3a4e7435cd81963ffd16b7a9128daf75f35f6de7

jobs:
  git-history:
    name: ${{ matrix.tool }}
    if: github.event_name != 'issues' && github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        tool: [gitleaks, betterleaks]
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install ${{ matrix.tool }}
        run: |
          if [ "${{ matrix.tool }}" = gitleaks ]; then
            .github/scripts/install-scanner.sh gitleaks "$GITLEAKS_VERSION" "$GITLEAKS_SHA256"
          else
            .github/scripts/install-scanner.sh betterleaks "$BETTERLEAKS_VERSION" "$BETTERLEAKS_SHA256"
          fi

      - name: Build scan config
        env:
          PRIVATE_TERMS_TOML: ${{ secrets.PRIVATE_TERMS_TOML }}
        run: .github/scripts/scan-config.sh

      - name: Scan git history
        run: >-
          ${{ matrix.tool }} git . --config "$SCAN_CONFIG" --redact --no-banner
          --report-format json --report-path "$RUNNER_TEMP/findings.json"

      - name: Summarize findings
        if: always()
        run: .github/scripts/scan-summary.sh "${{ matrix.tool }} (git history)" "$RUNNER_TEMP/findings.json"

      - name: Write SARIF report
        if: always()
        run: >-
          ${{ matrix.tool }} git . --config "$SCAN_CONFIG" --redact --no-banner --exit-code 0
          --report-format sarif --report-path "$RUNNER_TEMP/findings.sarif"

      # Fork pull requests get a read-only token and cannot upload.
      - name: Upload SARIF to code scanning
        if: always() && !github.event.pull_request.head.repo.fork
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: ${{ runner.temp }}/findings.sarif
          category: ${{ matrix.tool }}

  issues:
    name: betterleaks-issues
    # gitleaks has no GitHub API source, so only betterleaks scans issues and pull requests.
    if: github.event_name != 'push' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout (config only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install betterleaks
        run: .github/scripts/install-scanner.sh betterleaks "$BETTERLEAKS_VERSION" "$BETTERLEAKS_SHA256"

      - name: Build scan config
        env:
          PRIVATE_TERMS_TOML: ${{ secrets.PRIVATE_TERMS_TOML }}
        run: .github/scripts/scan-config.sh

      - name: Scan issues, pull requests, and comments
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          betterleaks github "https://github.com/${{ github.repository }}"
          --include issues,issue-comments,prs,pr-comments --exclude repos
          --config "$SCAN_CONFIG" --redact --no-banner
          --report-format json --report-path "$RUNNER_TEMP/findings.json"

      - name: Summarize findings
        if: always()
        run: .github/scripts/scan-summary.sh "betterleaks (issues and pull requests)" "$RUNNER_TEMP/findings.json"
