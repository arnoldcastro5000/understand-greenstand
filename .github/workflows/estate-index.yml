name: Estate index

# Fails when the README.md estate index does not match estate.json and repos/*/meta.json,
# when a repos/<name>/ directory has no estate.json entry, or when it lacks a file that the
# index links to. Fix: run `node .github/scripts/build-index.mjs` and commit README.md.
# Also fails when an ecosystem map in ARCHITECTURE.md is stale, when ecosystem.json has an
# error, or when a repo was regenerated after its edges were checked. Fix: run
# `node .github/scripts/build-ecosystem-maps.mjs` and follow its errors.
# Also fails when a glossary (repos/<name>/GLOSSARY.md, or the estate GLOSSARY.md) does not
# match the domain graphs. The estate glossary also lists the resources of shared-resources.json.
# Thus a change of shared-resources.json can make it stale. Fix: run
# `node .github/scripts/build-glossary.mjs`.
# Also fails when the Start here or Regenerating section of a per-repo README
# (repos/<name>/README.md) is missing or stale. The Start here section comes from estate.json,
# the graph, shared-resources.json, and the title of docs/shared-resources.md. Thus a change of
# shared-resources.json can make it stale. Also fails when the Start here section is not first.
# Also fails when that README has an em dash, tells how to view the graphs outside the Start here
# section, or has a Regenerating heading that the script does not write. Fix: run
# `node .github/scripts/build-repo-readmes.mjs`, or edit the line that the error names.
# Also fails when an onboarding guide (repos/<name>/ONBOARDING.md) has a wrong title, a table, or
# an em dash outside code. Fix: run `node .github/scripts/build-onboarding.mjs`. If the first line
# of a guide is not a title, run /understand-anything:understand-onboard again.
# Also fails when a line of edited text or of a per-repo README names a former name of a
# renamed repo (formerNames in estate.json). Fix: run
# `node .github/scripts/check-former-names.mjs` and use the new name on each line that it names.
# Also fails when a graph (repos/<name>/knowledge-graph.json) has a node for a file of .ua/,
# a reference to a node that the graph does not have, or a wrong project block (also in
# domain-graph.json). Fix: regenerate the repo with --exclude ".ua/" (docs/regenerating.md,
# step 2), remove the reference, or correct the project block (step 2).
# Also fails when the built text of the shared-resource page (docs/shared-resources.md) is stale,
# when shared-resources.json has an error, when a repo was regenerated after its facts were
# checked, when the ## heading of a resource is not its name with its id as the anchor, or when
# the sections are not in the order of the resources in shared-resources.json. The heading of a
# resource is the ## heading above its blocks or, for a resource with no evidence (no blocks),
# its one ## heading. Fix: run `node .github/scripts/build-shared-resources.mjs` and
# follow its errors.
# When a push or a pull request changes shared-resources.json, also fails when a name is not in
# its cited lines at the snapshot (the script reads them through the GitHub API). Fix the
# evidence entry that the error names.
# No path filter: a path-filtered check stays pending forever if it is ever made required.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: estate-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  estate-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Check the estate index
        run: node .github/scripts/build-index.mjs --check

      - name: Check the ecosystem maps
        run: node .github/scripts/build-ecosystem-maps.mjs --check

      - name: Check the glossaries
        run: node .github/scripts/build-glossary.mjs --check

      - name: Check the per-repo READMEs
        run: node .github/scripts/build-repo-readmes.mjs --check

      - name: Check the onboarding guides
        run: node .github/scripts/build-onboarding.mjs --check

      - name: Check for former names
        run: node .github/scripts/check-former-names.mjs

      - name: Check the graphs
        run: node .github/scripts/check-graphs.mjs

      - name: Check the shared-resource page
        run: node .github/scripts/build-shared-resources.mjs --check

      # Only when shared-resources.json changes: the step reads GitHub, and the other steps stay
      # offline. BASE is the commit before the push, or the base of the pull request. When it is
      # not known (a new branch), the step runs.
      - name: Check the evidence of the shared-resource facts
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$BASE" =~ ^[0-9a-f]{40}$ && "$BASE" != 0000000000000000000000000000000000000000 ]] \
            && git fetch --quiet --no-tags --depth=1 origin "$BASE" \
            && git diff --quiet "$BASE" HEAD -- shared-resources.json; then
            echo "shared-resources.json did not change since ${BASE:0:7}: no evidence check"
          else
            node .github/scripts/build-shared-resources.mjs --evidence
          fi
