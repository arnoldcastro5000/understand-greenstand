name: Estate index

# Fails when the README.md estate index does not match estate.json and repos/*/meta.json,
# when a repos/<name>/ directory has no estate.json entry, or when it lacks a file that the
# index links to. Fix: run `node .github/scripts/build-index.mjs` and commit README.md.
# Also fails when the "Run it locally" section of an ONBOARDING.md is missing or does not
# match repos/<name>/run-locally.json. Fix: run `node .github/scripts/build-onboarding.mjs`.
# No path filter: a path-filtered check stays pending forever if it is ever made required.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: estate-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  estate-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Check the estate index
        run: node .github/scripts/build-index.mjs --check

      - name: Check the Run it locally sections
        run: node .github/scripts/build-onboarding.mjs --check
