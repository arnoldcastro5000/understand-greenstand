name: Deploy the moved site to Pages

# The docs moved to the folder understand-greenstand/ of Greenstand/greenstand-documentation, and the
# site moved to https://greenstand.github.io/greenstand-documentation/. This repo is archived. Its Pages
# site keeps a moved page for each page of the old site (moved-pages.txt) and a 404.html for every
# other path. Each sends the reader to the same path on the new site (build-moved-site.mjs).
# The workflow has no schedule and uses no secret. It runs only first-party actions and the script of
# this repo.

on:
  push:
    branches: [main]
    paths:
      - "moved-pages.txt"
      - ".github/scripts/build-moved-site.mjs"
      - ".github/workflows/deploy-moved-site.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; do not cancel an in-progress deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Build the moved site
        run: node .github/scripts/build-moved-site.mjs _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          # Since v4 the action drops dotfiles by default; keep _site/.nojekyll.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
