name: Deploy viewers to Pages

# Builds one static Understand-Anything viewer per documented repo and publishes them
# to GitHub Pages, one per subpath (/understand-greenstand/<repo>/). No built bundles
# live in git: the viewer is built from a pinned Understand-Anything source ref each run.

on:
  push:
    branches: [main]
    paths:
      - "repos/**"
      - ".github/workflows/deploy-viewers.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; do not cancel an in-progress deploy.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Pin the viewer source. Nearest public tag to the plugin (2.9.4) is v2.9.0.
  UA_REF: v2.9.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs repo
        uses: actions/checkout@v4

      - name: Checkout Understand-Anything source (pinned)
        uses: actions/checkout@v4
        with:
          repository: Egonex-AI/Understand-Anything
          ref: ${{ env.UA_REF }}
          path: _ua

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: _ua/pnpm-lock.yaml

      - name: Install and build the dashboard (demo/static)
        working-directory: _ua
        run: |
          set -euo pipefail
          # Overlay the source-from-github viewer patch onto the pinned upstream ref
          # (makes CodeViewer load source from GitHub raw when a per-repo config.json
          # supplies sourceBaseUrl). working-directory is _ua, a git checkout.
          git apply --verbose "${GITHUB_WORKSPACE}/viewer/source-from-github.patch"
          pnpm install --frozen-lockfile
          pnpm --filter @understand-anything/core build
          # The repo layout differs across refs, so discover the dashboard package dir.
          DASH_DIR="$(find . -type d -path '*/packages/dashboard' | head -1)"
          echo "Dashboard dir: $DASH_DIR"
          cd "$DASH_DIR"
          # Static demo build, relative base + relative graph URLs so one bundle
          # works from any subpath, loading ./knowledge-graph.json per directory.
          VITE_GRAPH_URL=./knowledge-graph.json \
          VITE_DOMAIN_GRAPH_URL=./domain-graph.json \
            pnpm exec vite build --config vite.config.demo.ts --base=./
          echo "DIST=$(pwd)/dist" >> "$GITHUB_ENV"

      - name: Install markdown renderer
        run: npm install marked@12

      - name: Assemble the Pages site
        run: |
          set -euo pipefail
          DIST="${DIST:?dashboard dist path not set by build step}"
          OUT="_site"
          rm -rf "$OUT"; mkdir -p "$OUT"
          touch "$OUT/.nojekyll"
          rows=""
          for dir in repos/*/; do
            repo="$(basename "$dir")"
            [ -f "$dir/knowledge-graph.json" ] || continue
            mkdir -p "$OUT/$repo"
            # Viewer bundle + graph data (relative-base build works at any subpath).
            cp -r "$DIST"/. "$OUT/$repo/"
            cp "$dir/knowledge-graph.json" "$OUT/$repo/knowledge-graph.json"
            [ -f "$dir/domain-graph.json" ] && cp "$dir/domain-graph.json" "$OUT/$repo/domain-graph.json"
            if [ -f "$dir/meta.json" ]; then
              cp "$dir/meta.json" "$OUT/$repo/meta.json"
              # Per-repo config.json: point the viewer's source panel at GitHub raw at the
              # analyzed commit, so "view source" loads the real code with no server.
              sha="$(jq -r '.gitCommitHash // empty' "$dir/meta.json")"
              if [ -n "$sha" ]; then
                printf '{"sourceBaseUrl":"https://raw.githubusercontent.com/Greenstand/%s/%s/"}\n' \
                  "$repo" "$sha" > "$OUT/$repo/config.json"
                echo "  config.json: $repo @ $sha"
              else
                echo "  WARN: no gitCommitHash in $dir/meta.json; no config.json for $repo"
              fi
            fi
            # Human docs: copy the raw markdown and render styled HTML beside the viewer.
            doclinks=""
            if [ -f "$dir/ONBOARDING.md" ]; then
              cp "$dir/ONBOARDING.md" "$OUT/$repo/ONBOARDING.md"
              node .github/scripts/render-md.mjs "$dir/ONBOARDING.md" "$OUT/$repo/onboarding.html" "$repo — Onboarding" "./index.html" "Viewer"
              doclinks="$doclinks &middot; <a href=\"./$repo/onboarding.html\">Onboarding</a>"
            fi
            if [ -f "$dir/README.md" ]; then
              cp "$dir/README.md" "$OUT/$repo/README.md"
              node .github/scripts/render-md.mjs "$dir/README.md" "$OUT/$repo/readme.html" "$repo — README" "./index.html" "Viewer"
              doclinks="$doclinks &middot; <a href=\"./$repo/readme.html\">README</a>"
            fi
            echo "  assembled: $repo"
            rows="$rows      <li><a class=\"viewer\" href=\"./$repo/\">$repo</a>$doclinks</li>\n"
          done
          # Landing index: each repo links to its Viewer, Onboarding, and README.
          printf '<!doctype html>\n<html lang="en"><head><meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>understand-greenstand</title>\n<style>:root{color-scheme:light dark}body{font:16px/1.6 system-ui,sans-serif;max-width:44rem;margin:3rem auto;padding:0 1.25rem}h1{font-size:1.5rem}ul{list-style:none;padding:0}li{margin:.6rem 0;padding:.6rem .8rem;border:1px solid #8884;border-radius:8px}a{color:#0969da;text-decoration:none}a:hover{text-decoration:underline}a.viewer{font-weight:600}.sub{color:#8888}.starthere{border:2px solid #0969da;border-radius:10px;padding:1rem 1.1rem;margin:1.5rem 0}.starthere .label{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#0969da}.starthere .title{display:inline-block;margin:.2rem 0;font-size:1.2rem;font-weight:700}.starthere .desc{margin:.3rem 0 .5rem}.starthere .deeper{font-size:.9rem;color:#8888}</style>\n</head><body>\n<h1>understand-greenstand</h1>\n<p>Machine-generated documentation for the core-active Greenstand estate. Each repo has an interactive knowledge-graph viewer plus a human onboarding guide.</p>\n<div class="starthere">\n<div class="label">Start here</div>\n<a class="title" href="https://github.com/Greenstand/Greenstand-Overview">Greenstand Overview &rarr;</a>\n<p class="desc">New to Greenstand? Start with the Overview: the mission, the platform big picture, and how to make your first contribution.</p>\n<div class="deeper">Go deeper: <a href="https://github.com/Greenstand/greenstand-documentation">Documentation</a> &middot; <a href="https://github.com/Greenstand/treetracker-decisions">Architecture decisions</a></div>\n</div>\n<h2 style="font-size:1.1rem">Documented repositories</h2>\n<ul>\n%b</ul>\n</body></html>\n' "$rows" > "$OUT/index.html"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
