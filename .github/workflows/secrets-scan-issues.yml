name: Secrets scan (issues)

# Scans issues, pull requests, and their comments for leaked secrets with betterleaks.
# gitleaks has no GitHub API source, so only betterleaks runs here. It uses the same shared
# config and private-terms rule as secrets-scan.yml. A finding fails the job.
# Reports are always --redact, so logs and summaries hold no secret.
# Issue events run this file from the default branch only. The scan reads issue text as
# data; never interpolate issue fields into a run step.

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-scan-issues
  cancel-in-progress: true

env:
  # Keep in step with secrets-scan.yml.
  BETTERLEAKS_VERSION: 1.9.0
  BETTERLEAKS_SHA256: f8b185a39ffcece2a1ca82bf3a4e7435cd81963ffd16b7a9128daf75f35f6de7

jobs:
  issues:
    name: betterleaks-issues
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout (config only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install betterleaks
        run: .github/scripts/install-scanner.sh betterleaks "$BETTERLEAKS_VERSION" "$BETTERLEAKS_SHA256"

      - name: Build scan config
        env:
          PRIVATE_TERMS_TOML: ${{ secrets.PRIVATE_TERMS_TOML }}
        run: .github/scripts/scan-config.sh

      - name: Scan issues, pull requests, and comments
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          betterleaks github "https://github.com/${{ github.repository }}"
          --include issues,issue-comments,prs,pr-comments --exclude repos
          --config "$SCAN_CONFIG" --redact --no-banner
          --report-format json --report-path "$RUNNER_TEMP/findings.json"

      - name: Summarize findings
        if: always()
        run: .github/scripts/scan-summary.sh "betterleaks (issues and pull requests)" "$RUNNER_TEMP/findings.json"
